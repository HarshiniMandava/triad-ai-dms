
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIAD AI | Document Management System</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 55px;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none !important;
            background: transparent !important;
            padding: 8px !important;
            color: #475569 !important;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .password-toggle:hover {
            color: #0f766e !important;
        }

        .password-toggle svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>

<body>
    <main class="auth-container">
        <div class="auth-card">

            <div class="brand">
                <h1>TRIAD AI</h1>
                <p>Document Management System</p>
            </div>

            <div class="tabs">
                <button id="loginTab" class="active"
                        onclick="showLogin()">
                    Login
                </button>

                <button id="registerTab"
                        onclick="showRegister()">
                    Register
                </button>
            </div>

            <!-- LOGIN -->
            <form id="loginForm">
                <h2>Welcome Back</h2>

                <label for="loginEmail">Email</label>
                <input type="email"
                       id="loginEmail"
                       placeholder="Enter your email"
                       required>

                <label for="loginPassword">Password</label>

                <div class="password-wrapper">
                    <input type="password"
                           id="loginPassword"
                           placeholder="Enter your password"
                           required>

                    <button type="button"
                            class="password-toggle"
                            onclick="togglePassword('loginPassword', this)"
                            aria-label="Show password"
                            aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M3 3l18 18"/>
                        </svg>
                    </button>
                </div>

                <button type="submit" class="primary-btn">
                    Login
                </button>
            </form>

            <!-- REGISTER -->
            <form id="registerForm" style="display: none;">
                <h2>Create Account</h2>

                <label for="registerUsername">Username</label>
                <input type="text"
                       id="registerUsername"
                       placeholder="Enter username"
                       required>

                <label for="registerEmail">Email</label>
                <input type="email"
                       id="registerEmail"
                       placeholder="Enter email"
                       required>

                <label for="registerPassword">Password</label>

                <div class="password-wrapper">
                    <input type="password"
                           id="registerPassword"
                           placeholder="Create password"
                           required>

                    <button type="button"
                            class="password-toggle"
                            onclick="togglePassword('registerPassword', this)"
                            aria-label="Show password"
                            aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M3 3l18 18"/>
                        </svg>
                    </button>
                </div>

                <label for="registerDivision">Division</label>
                <select id="registerDivision" required>
                    <option value="">Select division</option>
                    <option value="IT">IT</option>
                    <option value="HR">HR</option>
                    <option value="Finance">Finance</option>
                </select>

                <button type="submit" class="primary-btn">
                    Register
                </button>
            </form>

            <p id="message" role="status" aria-live="polite"></p>

        </div>
    </main>

    <script src="config.js"></script>
    <script src="script.js"></script>

    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const visible = input.type === "password";

            input.type = visible ? "text" : "password";

            button.setAttribute(
                "aria-label",
                visible ? "Hide password" : "Show password"
            );

            button.setAttribute(
                "aria-pressed",
                String(visible)
            );

            button.querySelector("svg").innerHTML = visible
                ? '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'
                : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/>';
        }
    </script>
</body>
</html>
