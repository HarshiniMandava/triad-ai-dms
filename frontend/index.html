
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIAD AI | Document Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <div class="brand">
                <h1>TRIAD AI</h1>
                <p>Document Management System</p>
            </div>

            <div class="tabs">
                <button id="loginTab" class="active"
                    onclick="showLogin()">Login</button>
                <button id="registerTab"
                    onclick="showRegister()">Register</button>
            </div>

            <form id="loginForm">
                <h2>Welcome Back</h2>

                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail"
                    placeholder="Enter your email" required>

                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword"
                    placeholder="Enter your password" required>

                <button type="submit" class="primary-btn">
                    Login
                </button>
            </form>

            <form id="registerForm" style="display: none;">
                <h2>Create Account</h2>

                <label for="registerUsername">Username</label>
                <input type="text" id="registerUsername"
                    placeholder="Enter username" required>

                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail"
                    placeholder="Enter email" required>

                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword"
                    placeholder="Create password" required>

                <label for="registerDivision">Division</label>
                <select id="registerDivision" required>
                    <option value="">Select division</option>
                    <option value="IT">IT</option>
                    <option value="HR">HR</option>
                    <option value="Finance">Finance</option>
                    <option value="Operations">Operations</option>
                </select>

                <button type="submit" class="primary-btn">
                    Register
                </button>
            </form>

            <p id="message" role="status" aria-live="polite"></p>
        </div>
    </main>

    <script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
